[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-transcribe-cli"
version = "0.1.0"
description = "A fast, dependency-light CLI for hosted speech-to-text through OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John King" }]
keywords = ["transcription", "speech-to-text", "openrouter", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.scripts]
transcribe-cli = "transcribe_cli.cli:main"

[project.urls]
Homepage = "https://github.com/almostmachines/openrouter-transcribe-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_cli"]
